<title>Meu Estudo BB</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1b2430; --mut:#667085; --line:#e3e7ee; --acc:#2457d6; --acc-ink:#fff; --ok:#12805c; --warn:#b54708; --bad:#b42318; --soft:#eef2fb;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#12161c; --card:#1b212a; --ink:#e8ecf2; --mut:#9aa6b6; --line:#2b3441; --acc:#7aa2ff; --acc-ink:#0d1320; --ok:#4fd1a1; --warn:#f6b26b; --bad:#ff8a80; --soft:#222b3a; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:0 0 60px}
a{color:var(--acc)}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px 12px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:19px;margin:0 0 2px}
.sub{color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.stat{background:var(--soft);border-radius:10px;padding:9px 12px}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--mut)}
.bar{height:6px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
nav .wrap{display:flex;gap:2px;padding:0 10px}
nav button{background:none;border:0;padding:12px 14px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;font-weight:600}
nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 220px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:hsl(var(--h,220) 70% 92%);color:hsl(var(--h,220) 55% 28%)}
@media (prefers-color-scheme:dark){.badge{background:hsl(var(--h,220) 35% 24%);color:hsl(var(--h,220) 80% 85%)}}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=url],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px;padding:0 4px}
.vid{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:var(--card)}
.vid.w{opacity:.6}
.vid .t{flex:1;min-width:0}
.vid .t div{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.vid .t small{color:var(--mut)}
.play{background:var(--acc);color:var(--acc-ink);text-decoration:none;border-radius:8px;padding:6px 12px;font-weight:700;white-space:nowrap;font-size:13px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
.tablebox{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{position:sticky;top:0;background:var(--soft);font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;z-index:1}
td input,td select,td textarea{padding:5px 7px;min-width:70px}
tr.done td{background:color-mix(in srgb,var(--ok) 8%,var(--card))}
tr.wk td{background:var(--soft);font-weight:700;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 9px;margin:2px 4px 2px 0;font-size:12px;background:var(--card);max-width:240px}
.chip a{text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.chip.w{opacity:.55;text-decoration:line-through}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters select,.filters input{width:auto;min-width:130px}
.muted{color:var(--mut)}
.pill{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--mut)}
.notice{background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.modalbg{position:fixed;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px;z-index:20;overflow:auto}
.modal{background:var(--card);border-radius:14px;max-width:640px;width:100%;padding:16px;border:1px solid var(--line)}
.modal h3{margin:0 0 10px}
.pick{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.pick:hover{background:var(--soft);border-color:var(--line)}
#status{position:fixed;right:12px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--mut);z-index:10}
#status.err{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
label.f{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.empty{padding:26px;text-align:center;color:var(--mut)}
svg text{fill:var(--mut);font-size:11px}
.timer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:8px 10px;border:1px dashed var(--line);border-radius:10px}
.timer .clock{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;min-width:64px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0;cursor:pointer}
.opt:hover:not([disabled]){background:var(--soft)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.expl{background:var(--soft);border-radius:10px;padding:9px 12px;margin:8px 0;font-size:14px}
.revrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.revrow:last-child{border-bottom:0}
.sbar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;min-width:70px}
.sbar i{display:block;height:100%}
.aibox{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.aibox textarea{background:var(--card)}
.ans{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.ans .a{white-space:pre-wrap;margin-top:4px;font-size:14px}
.prov{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
</style>
</head>

function newTema(date,base){if(TEMA2[date]&&TEMA2[date][0]===base)return TEMA2[date][1];if(ING.indexOf(date)>=0&&base.indexOf('Inglês')<0)return base+' + Inglês';return base;}

function normalize(s){

  o.settings.cols=Object.assign({},d.settings.cols,(s.settings&&s.settings.cols)||{});

  o.settings.ai=Object.assign({tier:'default',effort:'medium',mathHigh:true,econ:true},(s.settings&&s.settings.ai)||{});
  o.rows.forEach(function(r){r.videos=r.videos||[];r.cc=r.cc||{};r.rv=r.rv||[];r.min=+r.min||0;r.resumo=r.resumo||'';r.duv=Array.isArray(r.duv)?r.duv:[];if(r.sem==null)r.sem=weekOf(r.date);});

function saveSoon(){ state.upd=Date.now(); dirty=true; saveLocal(); if(!canSave) return; setStatus('Salvando…'); clearTimeout(timer); timer=setTimeout(flush,500); }
function flushNow(){ clearTimeout(timer); if(dirty&&canSave) flush(); }
function flush(){
  if(saving){again=true;return Promise.resolve();}
  saving=true; again=false; clearTimeout(retryT);
  var stamp=state.upd||Date.now(); state.upd=stamp;
  saveLocal();
  var p;
  if(dbDoc){
    var snap; try{snap=JSON.parse(JSON.stringify(state));}catch(e){snap=null;}
    p=new Promise(function(res){
      var fin=false;
      function fail(){ if(fin) return; fin=true; clearTimeout(to); setStatus('Ainda não salvo na conta. Tentando de novo…',true); retryT=setTimeout(function(){flush();},5000); res(); }
      var to=setTimeout(fail,15000);
      try{
        Promise.resolve(dbDoc.set(snap)).then(function(){
          if(fin) return; fin=true; clearTimeout(to);
          if(state.upd===stamp) dirty=false;
          setStatus('Salvo na sua conta ✓ '+hhmm()); res();
        }).catch(function(){fail();});
      }catch(e){fail();}
    });
  } else { setStatus('Salvo neste aparelho ✓'); dirty=false; p=Promise.resolve(); }
  return p.then(function(){saving=false;if(again){again=false;flush();}});
}

/* junta o que está neste navegador com o que está na conta: vale o mais recente e nada escrito se perde */
function mergeStates(a,b){
  if(!a) return b;
  var aNew=(a.upd||0)>(b.upd||0), base=aNew?a:b, other=aNew?b:a;
  Object.keys(other.vn||{}).forEach(function(k){
    var bv=base.vn[k], ov=other.vn[k];
    if(ov&&(bv==null||bv==='')) base.vn[k]=ov;
    else if(ov&&bv&&ov!==bv&&ov.length>bv.length&&ov.indexOf(bv)===0) base.vn[k]=ov;
  });
  var byId={}; base.rows.forEach(function(r){byId[r.id]=r;});
  other.rows.forEach(function(r){var t=byId[r.id]; if(!t) return;
    ['nota','resumo'].forEach(function(f){ var ov=r[f]||'', bv=t[f]||''; if(ov&&(!bv||(ov.length>bv.length&&ov.indexOf(bv)===0))) t[f]=ov; });
  });
  ['erros','sims','xv'].forEach(function(f){
    var have={}; (base[f]||[]).forEach(function(x){have[x.id]=1;});
    (other[f]||[]).forEach(function(x){ if(x&&x.id&&!have[x.id]) base[f].push(x); });
  });
  return base;
}

  for(var i=0;i<LIB.length;i++) if(LIB[i].id===id) return LIB[i];
  for(var j=0;j<state.xv.length;j++) if(state.xv[j].id===id) return state.xv[j];
  return null;
}

function stats(){
  var rows=state.rows.filter(function(r){return r.mat!=='Folga';});
  var done=rows.filter(function(r){return r.st==='Feito';}).length;
  var q=0,a=0; state.rows.forEach(function(r){q+=+r.q||0;a+=+r.a||0;});
  var sched={},wd=0,tot=0;
  state.rows.forEach(function(r){r.videos.forEach(function(id){sched[id]=1;});});
  Object.keys(sched).forEach(function(id){var v=getV(id);if(v){tot++; if(isW(id)) wd++;}});
  var wsec=0; state.w.forEach(function(id){var v=getV(id);if(v)wsec+=v.d;});
  var mins=0; state.rows.forEach(function(r){mins+=+r.min||0;});
  return {done:done,n:rows.length,q:q,a:a,vw:wd,vt:tot,wsec:wsec,mins:mins};
}

function dueReviews(){
  var t=todayISO(), out=[];
  function pick(base,done){ var best=0; [1,7,30].forEach(function(n){ if((done||[]).indexOf(n)<0 && addDays(base,n)<=t) best=n; }); return best; }
  state.rows.forEach(function(r){
    if(r.st!=='Feito'||r.mat==='Folga'||r.mat==='Revisão'||r.mat==='Redação') return;
    var base=r.doneAt||r.date, n=pick(base,r.rv);
    if(n) out.push({k:'r',id:r.id,n:n,due:addDays(base,n),mat:r.mat,tema:r.tema});

var timer1=null, tick=null;
function timerBox(r){
  if(r.mat==='Folga') return '';
  var run=timer1&&timer1.row===r.id, other=timer1&&!run;
  var h='<div class="timer"><b>Foco</b>';
  if(run){
    h+='<span class="clock" id="clock">'+fmtDur(Math.max(0,Math.ceil((timer1.end-Date.now())/1000)))+'</span><button class="btn sm" data-act="tstop" data-row="'+r.id+'">Parar e salvar</button>';
  } else {
    h+='<span class="clock muted">'+FOCO_MIN+':00</span><button class="btn sm" data-act="tstart" data-row="'+r.id+'"'+(other?' disabled title="Outro cronômetro está rodando"':'')+'>▶ Iniciar '+FOCO_MIN+' min</button>';
  }

function tstart(rowId){
  if(timer1) return;
  timer1={row:rowId,start:Date.now(),end:Date.now()+FOCO_MIN*60000};
  clearInterval(tick); tick=setInterval(tickFn,1000); render();
}
function tickFn(){
  if(!timer1){clearInterval(tick);return;}
  var left=Math.ceil((timer1.end-Date.now())/1000);
  if(left<=0){ tfinish(true); return; }
  var c=document.getElementById('clock'); if(c) c.textContent=fmtDur(left);
  document.title=fmtDur(left)+' · foco';
}
function tfinish(auto){
  if(!timer1) return;
  var r=rowById(timer1.row), mins=Math.min(FOCO_MIN,Math.round((Math.min(Date.now(),timer1.end)-timer1.start)/60000));
  if(r&&mins>0){ r.min=(+r.min||0)+mins; saveSoon(); }
  timer1=null; clearInterval(tick); document.title='Meu Estudo BB';
  if(auto) setStatus('Foco concluído: pausa de 5 minutos ✓');
  render();
}

function askAI(prompt,o){

  if(!list.length) return Promise.reject({code:'no_provider'});

    if(i>=list.length) return Promise.reject(errs.length===1?errs[0]:{code:'all_failed',errs:errs});
    var k=list[i];
    return PROV[k].call(prompt,o).then(function(r){

function aiErr(e){

  if(c==='all_failed') return 'Nenhuma IA respondeu. '+e.errs.map(function(x){return aiErr(x);}).join(' | ');
  if(c==='bad_key') return who+'chave inválida ou sem permissão. Confira em Ajustes.';
  if(c==='network') return (navigator.onLine===false)?'Você está sem internet. A IA volta a funcionar quando a conexão voltar; o resto do sistema continua normal.':who+'não consegui conectar. Confira a internet e o endereço da API.';
  if(c==='http') return e.message||'A IA devolveu um erro.';
  if(c==='rate_limited'&&e.provider) return who+'limite de uso atingido por agora. Tente mais tarde ou use outra IA.';
  if((c==='invalid_json'||c==='empty_completion')&&e.provider) return who+'não conseguiu responder no formato certo desta vez.';
  if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed') return 'A IA não está liberada para você. Aceite o pedido de permissão quando ele aparecer, ou use o botão do Gran para questões reais.';

  if(c==='session_expired') return 'Sua sessão expirou. Entre de novo no Claude e abra o sistema.';
  if(c==='invalid_json'||c==='empty_completion'||c==='refused') return 'A IA não conseguiu montar as questões desta vez. Tente de novo.';
  return 'Não consegui gerar agora. Tente de novo em instantes.';
}

/* ---------- visão: Simulados ---------- */
function chart(){
  var s=state.sims.filter(function(x){return +x.total>0;});
  if(!s.length) return '';
  var W_=600,H_=210,L=34,B=28,T=10,n=s.length,bw=Math.min(54,(W_-L-10)/n*0.6),gap=(W_-L-10)/n;
  var svg='<svg viewBox="0 0 '+W_+' '+H_+'" width="100%" role="img" aria-label="Porcentagem de acertos por simulado">';
  [0,25,50,75,100].forEach(function(p){var y=T+(H_-T-B)*(1-p/100);svg+='<line x1="'+L+'" x2="'+(W_-6)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+p+'%</text>';});
  var ty=T+(H_-T-B)*(1-0.7);
  svg+='<line x1="'+L+'" x2="'+(W_-6)+'" y1="'+ty+'" y2="'+ty+'" stroke="var(--ok)" stroke-dasharray="5 4"/><text x="'+(W_-8)+'" y="'+(ty-4)+'" text-anchor="end" style="fill:var(--ok)">meta 70%</text>';
  s.forEach(function(x,i){var p=Math.round(100*(+x.acertos||0)/(+x.total)),h2=(H_-T-B)*p/100,cx=L+gap*i+gap/2;
    svg+='<rect x="'+(cx-bw/2)+'" y="'+(H_-B-h2)+'" width="'+bw+'" height="'+h2+'" rx="4" fill="var(--acc)"/><text x="'+cx+'" y="'+(H_-B-h2-5)+'" text-anchor="middle" style="fill:var(--ink)">'+p+'%</text><text x="'+cx+'" y="'+(H_-10)+'" text-anchor="middle">'+esc((x.nome||fmtD(x.date)).slice(0,12))+'</text>';});
  return '<div class="card"><b>Acertos por simulado</b>'+svg+'</div>';
}

function setField(obj,f,val){
  if(f.indexOf('c:')===0){obj.cc[f.slice(2)]=val;} else obj[f]=val;
}
document.addEventListener('input',function(e){
  var t=e.target,id;
  if(t.dataset.key){keyInput(t);return;}
  if(t.dataset.dvq){dvDraft[t.dataset.dvq]=t.value;return;}
  if(t.dataset.row){var r=rowById(t.dataset.row);if(!r)return;var f=t.dataset.f;
    if(f==='date'&&t.value){r.date=t.value;r.sem=weekOf(t.value);} else setField(r,f,t.value);
    saveSoon(); if(f==='q'||f==='a') renderHead(); if(f==='nota') refreshNoteUi(); return;}
  if(t.dataset.err){var x=state.erros.filter(function(a){return a.id===t.dataset.err;})[0];if(x){x[t.dataset.f]=t.value;saveSoon();}return;}
  if(t.dataset.sim){var y=state.sims.filter(function(a){return a.id===t.dataset.sim;})[0];if(y){y[t.dataset.f]=t.value;saveSoon();
      var p=document.getElementById('sp-'+y.id);if(p)p.textContent=(+y.total>0)?Math.round(100*(+y.acertos||0)/(+y.total))+'%':'';}return;}
  if(t.dataset.vn){state.vn[t.dataset.vn]=t.value;saveSoon();refreshNoteUi();return;}
  if(t.dataset.rs){var rs0=rowById(t.dataset.rs);if(rs0){rs0.resumo=t.value;saveSoon();}return;}
  if(t.dataset.peso){state.settings.pesos[t.dataset.peso]=Math.max(0,+t.value||0);saveSoon();return;}
  if(t.dataset.set==='nome'){state.settings.nome=t.value;saveSoon();renderHead();return;}
  if(t.dataset.fil==='q'){filt.q=t.value;clearTimeout(window.__ft);window.__ft=setTimeout(function(){var pos=t.selectionStart;render();var n=document.querySelector('[data-fil="q"]');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}},250);return;}
  if(t.dataset.vf==='q'){vfilt.q=t.value;clearTimeout(window.__ft);window.__ft=setTimeout(function(){var pos=t.selectionStart;render();var n=document.querySelector('[data-vf="q"]');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}},250);return;}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.dvl){dvLvl[t.dataset.dvl]=t.value;return;}
  if(t.id==='bkfile'){loadBkFile(t);return;}
  if(t.dataset.key) return;
  if(t.dataset.w){var id=t.dataset.w,i=state.w.indexOf(id);if(t.checked&&i<0)state.w.push(id);if(!t.checked&&i>=0)state.w.splice(i,1);saveSoon();render();return;}
  if(t.dataset.rv){var pr=t.dataset.rv.split(':'),n2=+pr[2],isR=pr[0]==='r',tg=isR?rowById(pr[1]):state.erros.filter(function(a){return a.id===pr[1];})[0];
    if(tg){var key=isR?'rv':'rev';tg[key]=tg[key]||[];[1,7,30].forEach(function(k){if(k<=n2&&tg[key].indexOf(k)<0)tg[key].push(k);});saveSoon();render();}return;}
  if(t.dataset.peso){render();return;}
  if(t.dataset.row&&t.dataset.f==='st'){var r=rowById(t.dataset.row);if(r){var was=r.st;r.st=t.value;if(t.value==='Feito'&&was!=='Feito'){r.doneAt=todayISO();r.rv=[];}if(t.value!=='Feito'){r.doneAt='';}saveSoon();render();}return;}
  if(t.dataset.row&&(t.dataset.f==='mat'||t.dataset.f==='date')){saveSoon();if(t.dataset.f==='date'){sortRows();}render();return;}
  if(t.dataset.err&&t.dataset.f==='mat'){return;}
  if(t.dataset.errrev){var x=state.erros.filter(function(a){return a.id===t.dataset.errrev;})[0];if(x){x.rev=x.rev||[];var n=+t.dataset.n,i2=x.rev.indexOf(n);if(t.checked&&i2<0)x.rev.push(n);if(!t.checked&&i2>=0)x.rev.splice(i2,1);saveSoon();}return;}
  if(t.dataset.fil){filt[t.dataset.fil]=t.value;render();return;}
  if(t.dataset.vf){vfilt[t.dataset.vf]=t.value;render();return;}
  if(t.dataset.set==='prova'){state.settings.prova=t.value;saveSoon();renderHead();return;}
  if(t.dataset.set==='aitier'||t.dataset.set==='aieffort'){state.settings.ai=state.settings.ai||{};state.settings.ai[t.dataset.set==='aitier'?'tier':'effort']=t.value;saveSoon();return;}
  if(t.dataset.set==='aiecon'){state.settings.ai=state.settings.ai||{};state.settings.ai.econ=t.checked;saveSoon();return;}
  if(t.dataset.set==='aimath'){state.settings.ai=state.settings.ai||{};state.settings.ai.mathHigh=t.checked;saveSoon();return;}
  if(t.dataset.set==='speed'){state.settings.speed=+t.value;saveSoon();render();return;}
  if(t.dataset.col){state.settings.cols[t.dataset.col]=t.checked;saveSoon();return;}
});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-act]'); if(!t) return;
  if(t.dataset.tab){go(t.dataset.tab);return;}
  var a=t.dataset.act;
  if(a==='closem'){ if(e.target===t) closeAll(); return; }
  if(a==='closem2'){closeAll();return;}
  if(a==='vnt'){var vv=t.dataset.vid;openN[vv]=!openN[vv];render();if(openN[vv]){var ta=document.querySelector('textarea[data-vn="'+vv+'"]');if(ta)ta.focus();}return;}
  if(a==='rsum'){resumir(t.dataset.row);return;}
  if(a==='dvask'){dvAsk(t.dataset.row);return;}
  if(a==='dvclaude'){t.href=claudeUrl(rowById(t.dataset.row),(dvDraft[t.dataset.row]||'').trim());return;}
  if(a==='dvdel'){var rdv=rowById(t.dataset.row);if(rdv){rdv.duv=(rdv.duv||[]).filter(function(d){return d.id!==t.dataset.d;});saveSoon();render();}return;}
  if(a==='dvall'){dvAll[t.dataset.row]=!dvAll[t.dataset.row];render();return;}
  if(a==='aitest'){aiTest(t.dataset.p);return;}
  if(a==='dlbk'){dlBackup();return;}
  if(a==='install'){if(installEvt){var ev=installEvt;installEvt=null;ev.prompt();ev.userChoice.then(function(c){if(c&&c.outcome==='accepted')installed=true;render();},function(){render();});}return;}
  if(a==='tstart'){tstart(t.dataset.row);return;}
  if(a==='tstop'){tfinish(false);return;}
  if(a==='qopen'){openQuiz(t.dataset.row,false);return;}
  if(a==='qcancel'){closeAll();return;}
  if(a==='qpick'){if(qz&&qz.set)qanswer(+t.dataset.k);return;}
  if(a==='qnext'){if(qz&&qz.set){qz.i++;renderQuiz();}return;}
  if(a==='qredo'){qredo(t.dataset.row,false);return;}
  if(a==='qnew'){askConfirm('Gerar 10 questões novas? Isso usa o limite do seu plano e apaga as respostas desta rodada.',function(){qredo(t.dataset.row,true);});return;}
  if(a==='late'){e.preventDefault();filt.sem='';filt.st='pend';filt.mat='';filt.q='';go('cronograma');return;}
  if(a==='picker'){openPicker(t.dataset.row);return;}
  if(a==='pick'){var r=rowById(t.dataset.row);if(r&&r.videos.indexOf(t.dataset.vid)<0){r.videos.push(t.dataset.vid);saveSoon();}modal('');render();return;}
  if(a==='detach'){var r2=rowById(t.dataset.row);if(r2){r2.videos=r2.videos.filter(function(v){return v!==t.dataset.vid;});saveSoon();render();}return;}
  if(a==='addrow'){var d=todayISO();var nr={id:uid(),date:d,sem:weekOf(d),mat:'Português',tema:'Novo estudo',videos:[],st:'A fazer',q:'',a:'',dif:'',nota:'',cc:{}};state.rows.push(nr);sortRows();filt.sem='';saveSoon();render();return;}
  if(a==='delrow'){var rid=t.dataset.row;askConfirm('Apagar este dia do cronograma?',function(){state.rows=state.rows.filter(function(r){return r.id!==rid;});saveSoon();render();});return;}
  if(a==='schedule'){openSchedule(t.dataset.vid);return;}
  if(a==='newvideo'){openNewVideo();return;}
  if(a==='delvideo'){var vid=t.dataset.vid;askConfirm('Apagar este vídeo da biblioteca?',function(){state.xv=state.xv.filter(function(v){return v.id!==vid;});state.rows.forEach(function(r){r.videos=r.videos.filter(function(v){return v!==vid;});});saveSoon();render();});return;}
  if(a==='adderr'){state.erros.push({id:uid(),date:todayISO(),mat:'Português',tema:'',why:MOTIVOS[0],regra:'',rev:[]});saveSoon();render();return;}
  if(a==='delerr'){var eid=t.dataset.err;askConfirm('Apagar este registro?',function(){state.erros=state.erros.filter(function(x){return x.id!==eid;});saveSoon();render();});return;}
  if(a==='addsim'){state.sims.push({id:uid(),date:todayISO(),nome:'Simulado '+(state.sims.length+1),acertos:'',total:'70',obs:''});saveSoon();render();return;}
  if(a==='delsim'){var sid=t.dataset.sim;askConfirm('Apagar este simulado?',function(){state.sims=state.sims.filter(function(x){return x.id!==sid;});saveSoon();render();});return;}
  if(a==='addcol'){var n=document.getElementById('newcol').value.trim();if(n){state.cc.push({id:'c'+uid(),name:n});saveSoon();render();}return;}
  if(a==='delcol'){var cid=t.dataset.col;askConfirm('Apagar esta coluna e o que foi escrito nela?',function(){state.cc=state.cc.filter(function(c){return c.id!==cid;});state.rows.forEach(function(r){delete r.cc[cid];});saveSoon();render();});return;}
  if(a==='copybk'){var ta=document.getElementById('bk');ta.value=JSON.stringify(state);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(_){}
    try{if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(function(){setStatus('Backup copiado ✓');},function(){});}catch(_){}
    setStatus(ok?'Backup copiado ✓':'Texto selecionado: use Ctrl+C');return;}
  if(a==='restorebk'){var txt=document.getElementById('bk').value;askConfirm('Substituir seus dados atuais pelo texto do backup?',function(){try{var o=JSON.parse(txt);if(!o||!Array.isArray(o.rows))throw new Error('formato');state=normalize(o);saveSoon();render();setStatus('Backup restaurado ✓');}catch(_){setStatus('Texto de backup inválido',true);}});return;}
  if(a==='reset'){askConfirm('Voltar ao plano padrão? Suas anotações, erros e simulados serão apagados.',function(){state=defaults();saveSoon();render();});return;}
});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(['hoje','cronograma','videos','raiox','erros','simulados','ajustes'].indexOf(h)>=0&&h!==tab){tab=h;render();}});

/* ---------- início ---------- */
function init(){
  var h=location.hash.slice(1); if(['hoje','cronograma','videos','raiox','erros','simulados','ajustes'].indexOf(h)>=0) tab=h;
  var localState=null;
  try{var raw=localStorage.getItem(LS);if(raw){state=normalize(JSON.parse(raw));localState=state;}}catch(e){}
  render();
  var late=false;
  var tm=setTimeout(function(){late=true;canSave=true;setStatus('Salvo neste aparelho ✓');},10000);
  var hasDoc=false;
  var p;
  try{
    if(typeof claude==='undefined'||!claude.use) throw new Error('sem runtime');
    p=Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
      var db=r[0],user=r[1]; if(!db||!user) return null;
      return Promise.resolve(user.id()).then(function(id){
        if(!id) return null;
        dbRef=db; uidRef=id; dbDoc=db.doc('data/users/'+id+'/estudo');
        return dbDoc.get();
      });
    });
  }catch(e){p=Promise.resolve(null);}
  p.then(function(snap){
    clearTimeout(tm);
    var mig=false;
    if(snap&&snap.exists&&!late){var d=snap.data();if(d&&Array.isArray(d.rows)){var dbS=normalize(d);mig=(d.pv||1)<3;state=mergeStates(localState,dbS);if(localState&&state!==dbS)mig=true;hasDoc=true;if(dirty)mig=true;}}
    canSave=true;
    if(dbDoc&&(!hasDoc||mig)){flush();} else setStatus(dbDoc?'Salvo na sua conta ✓ '+hhmm():'Salvo neste aparelho ✓');
    render();
  }).catch(function(){clearTimeout(tm);canSave=true;setStatus('Salvo neste aparelho ✓');render();});
}
init();
if(!INCLAUDE) setTimeout(function(){ if(navigator.onLine===false) netStatus(); },300);
})();
